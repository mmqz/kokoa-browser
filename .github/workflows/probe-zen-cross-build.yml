name: probe-zen-cross-build

# 构建【我们自己的】Kokoa 分支（= Zen 源码树 + 我们的改动）。
#
# 可行性结论（2026-09-15 实测）：
#   a) 磁盘【不是瓶颈】：标准 runner 实际是 145 GB 的盘（GitHub 官方文档写的 14 GB 不符），
#      装完全部依赖、再编完，仍剩 88 GB。
#   b) 时间【在上限内】：4 vCPU 下编译耗时 9690 秒（2 小时 41 分 30 秒），
#      作业总耗时 2 小时 53 分，在 GitHub 的 6 小时作业上限内。
#   c) 交叉链【可复现】：Ubuntu 依赖 + Wine + VS 工具链 + 256 个源码补丁全部成功。
#
# 本文件照抄 zen-browser/desktop 的 .github/workflows/windows-release-build.yml
# 的【步骤内容】，替换了 runner（blacksmith-* -> ubuntu-latest）与第三方 action，
# 去掉 PGO / 签名 / LTO（对可行性判断无意义，只吃时间与磁盘）。
#
# 【任务 1 之后】checkout 的是【本仓库】（tomjiu/kokoa-browser = Zen 源码树 + 我们的改动），
# 不再拉 zen-browser/desktop。engine/ 仍由 surfer download 从 Mozilla 源码包生成。

on:
  workflow_dispatch:
    inputs:
      through:
        description: "跑到哪一步就停（用于分段探明磁盘与耗时）"
        required: true
        type: choice
        default: "build"
        options:
          - bootstrap    # 只到交叉工具链就绪
          - build        # 一路编完

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # 官方硬上限 360，留 5 分钟余量
    env:
      SURFER_PLATFORM: win32
      ZEN_CROSS_COMPILING: "1"
      SURFER_COMPAT: x86_64
      CARGO_INCREMENTAL: "0"

      # 【2026-09-15 ★ 三次尝试全部失败，记录在此，避免后人再试】
      #
      # 目标：让 application.ini 的 Vendor / Profile 变成 Kokoa。
      # MOZ_APP_VENDOR / MOZ_APP_PROFILE 是 toolkit/moz.configure 里的 project_flag。
      #
      # 试过并【实测失败】的三种方式：
      #   1) mozconfig 里 export MOZ_APP_VENDOR=Kokoa
      #      -> InvalidOptionError: can not be set by mozconfig
      #         Values are accepted from: implied, environment, ...
      #   2) moz-configure.patch 里给 project_flag 加 default="Kokoa"
      #      -> 构建成功，但产物 Profile 仍是 zen（default 无效）
      #   3) CI workflow 的 job env 设 MOZ_APP_VENDOR: Kokoa   <- 本次
      #      -> InvalidOptionError: can not be set by environment
      #         Values are accepted from: implied
      #      【注意：报错里唯一允许的来源是 implied】
      #
      # 目前的结论：
      #   · 只能通过 imply_option 设置
      #   · 但 imply_option 接受的是【选项名】(如 --enable-xxx)，不是变量名
      #   · 而 Zen 自己也没设 MOZ_APP_VENDOR（它的 mozconfig 里没有）
      #   · 【待查清】Zen 的 Vendor=Zen OSS Team 到底从哪来
      #
      # 所以【暂时不加】—— 加了会让构建直接失败。
      # 见 docs/vendor-profile-unsolved.md

      # MOZ_APP_PROFILE 同理（未验证是否也报错，谨慎起见也先不加）

    steps:
      - name: ★ 贴牌环境变量 · 诊断（回答「谁设了 MOZ_*」）
        run: |
          # 【为什么加这一步】
          # TASK-09 查出：改 project_flag 的 default 无效，说明【有环境变量在覆盖】。
          # 但本仓库里搜不到谁设的。这一步把构建环境里的 MOZ_* 全打出来，
          # 一次性回答那个问题（TASK-09「没查清」的第 1 条）。
          echo "=== 构建环境里的 MOZ_* / MOZILLA_* ==="
          env | grep -iE '^(MOZ|MOZILLA)_' | sort || echo "(无)"
          echo ""
          echo "=== 我们显式设的两个（应该出现）==="
          echo "MOZ_APP_VENDOR=${MOZ_APP_VENDOR:-<未设>}"
          echo "MOZ_APP_PROFILE=${MOZ_APP_PROFILE:-<未设>}"
          echo ""
          echo "=== runner 默认可能有的品牌相关变量（排除干扰）==="
          env | grep -iE 'VENDOR|PROFILE|APP_NAME|BASENAME' | grep -viE 'MOZ_APP_(VENDOR|PROFILE)' || echo "(无)"

      - name: 磁盘 · 起点
        run: df -h / | tee /tmp/disk-00.txt

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false

      - name: 磁盘 · 清理后
        if: always()
        run: df -h / | tee /tmp/disk-01.txt

      - name: Checkout 本仓库（Kokoa 分支 = Zen 源码树）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Git 身份
        # 【关键】surfer download → init 会对 engine/ 执行 git init + commit。
        # 标准 ubuntu-latest runner 没有预置 git 身份（Blacksmith 有），
        # commit 会失败并留下零提交仓库，随后 mach bootstrap 读 git log -1 就崩。
        # 官方 CI 的 Setup Git 在 Download 之前 —— 必须同序，不能挪到 Import 之后。
        run: |
          git config --global user.email "ci@kokoa-browser.local"
          git config --global user.name "kokoa-browser CI"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm ci
        run: npm ci

      - name: surfer ci
        # display-version 必须是「数字.数字...」—— newtab/moz.build 会 int(split('.')[0])，
        # 用 probe 这类字符串会在 Build 的 configure 阶段直接 ValueError。
        run: npm run surfer -- ci --brand twilight --display-version 0.1.0t

      - name: 磁盘 · surfer ci 后
        if: always()
        run: df -h / | tee /tmp/disk-02.txt

      - name: Download Firefox
        run: npm run download

      - name: 校验 engine/ 已有提交
        run: |
          echo "=== 校验 engine/ 是否已有提交（必须非空，否则 bootstrap 必崩）==="
          git -C engine log --oneline -1
          git -C engine status -sb

      - name: 磁盘 · 源码下载后
        if: always()
        run: df -h / | tee /tmp/disk-03.txt

      - name: Setup for Windows（Ubuntu 依赖 + Wine + VS 工具链）
        run: |
          set -x
          mkdir -p ~/win-cross
          cd engine/
          sudo apt-get install -y python3-launchpadlib
          sudo add-apt-repository -y ppa:savoury1/backports
          sudo apt-get update
          sudo apt-get install -y python3-pip autoconf autoconf2.13 automake bison \
            build-essential cabextract curl cmake flex gawk gcc-multilib git gnupg jq \
            libbz2-dev libexpat1-dev libffi-dev libncursesw5-dev libsqlite3-dev libssl-dev \
            libtool libucl-dev libxml2-dev msitools ninja-build openssh-client p7zip-full \
            pkg-config procps python3-requests python3-toml scons subversion tar unzip \
            uuid uuid-dev wget zip zlib1g-dev aria2
          echo "=== Setup wine ==="
          aria2c "https://firefox-ci-tc.services.mozilla.com/api/index/v1/task/gecko.cache.level-3.toolchains.v3.linux64-wine.latest/artifacts/public/build/wine.tar.zst" -o wine.tar.zst
          tar --zstd -xf wine.tar.zst -C ~/win-cross
          rm wine.tar.zst
          echo "=== Setup Visual Studio ==="
          ./mach python --virtualenv build taskcluster/scripts/misc/get_vs.py build/vs/vs2026.yaml ~/win-cross/vs2026

      - name: 磁盘 · 交叉工具链后
        if: always()
        run: df -h / | tee /tmp/disk-04.txt

      - name: Import
        run: |
          . "$HOME/.cargo/env" || true
          npm run import -- --verbose

      - name: Download language packs（**不能跳过**）
        run: |
          set -x
          # 【为什么这一步不能跳过】
          # 2026-09-15 实测：跳过它会导致构建产物里【Zen 自己的全部文案缺失】——
          #   我们的 browser/omni.ja 12906 条目 vs 官方 Zen 的 13393，差 533 个
          #   全部是 zen-*（如 localization/zh-CN/browser/zen-command-palette.ftl）
          #
          # 它的真实职责（读 scripts/download-language-packs.sh 所得）：
          #   L72-74  从 mozilla-l10n/firefox-l10n 拉上游翻译到 locales/<lang>/
          #   L79-82  跑 scripts/copy_language_pack.py —— 把 locales/<lang>/ 复制到
          #             engine/browser/locales/<lang_code>/  <- 【唯一途径】
          #   L90-93  删掉 locales/<lang>/ 下非 zen* 的文件
          # Firefox 构建时再从 engine/browser/locales/ 打进 omni.ja 的 localization/。
          #
          # ⚠️ 我此前在工单里写「可以先跳过，省时间」是【错的】，已更正。
          #    当时只看了脚本名就下结论，没读实现。
          #
          # 代价：它会 git clone 【整个】mozilla-l10n/firefox-l10n（不是浅克隆）
          #       并 checkout 一个指定 commit。构建时间与磁盘占用会明显增加。
          ls -la build/firefox-cache/l10n-last-commit-hash 2>/dev/null || echo "!! 缺 l10n-last-commit-hash"
          sh scripts/download-language-packs.sh
          echo "=== 校验：engine/browser/locales 下有没有 zen 文案 ==="
          for L in en-US zh-CN de fr; do
            N=$(find engine/browser/locales/$L -name 'zen*.ftl' 2>/dev/null | wc -l)
            echo "  $L: $N 个 zen*.ftl"
          done
          echo "（若全为 0，说明这一步没生效）"

      - name: Bootstrap
        run: |
          set -x
          cd engine/
          chmod -R +x "$(echo ~)/win-cross/vs2026" || true
          cd ..
          npm run bootstrap
          cd engine/
          ls ~/.mozbuild/clang/lib/clang/
          echo "export LIB=\"$(cd ~/.mozbuild/clang/lib/clang/* && cd lib/windows && pwd)\"" >> ../configs/common/mozconfig
          cat ../configs/common/mozconfig
          sudo apt-get install -y dos2unix
          ls ~/win-cross/wine || true
          ls ~/win-cross/vs2026 || true

      - name: 磁盘 · bootstrap 后
        if: always()
        run: df -h / | tee /tmp/disk-05.txt

      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain $(cat .rust-toolchain)
          source $HOME/.cargo/env
          rustup target add x86_64-pc-windows-msvc
          WINDOWS_RS_VERSION=$(cat build/windows/.windows-rs-version)
          curl -fsSL "https://static.crates.io/crates/cargo-download/cargo-download-0.1.2.crate" | tar xz -C /tmp
          (cd /tmp/cargo-download-0.1.2 && cargo generate-lockfile && cargo update tinyvec --precise 1.12.0)
          RUSTFLAGS="--cap-lints=allow" cargo install --path /tmp/cargo-download-0.1.2 --locked
          cd engine/
          cargo download -x windows=$WINDOWS_RS_VERSION
          echo "" >> ../configs/common/mozconfig
          echo "export MOZ_WINDOWS_RS_DIR=$(pwd)/windows-$WINDOWS_RS_VERSION" >> ../configs/common/mozconfig

      - name: Surface（到这里就停）
        if: ${{ inputs.through == 'bootstrap' }}
        run: |
          echo "=== 已按要求停在 bootstrap。以下为磁盘证据 ==="
          cat /tmp/disk-*.txt
          df -h /

      - name: 确认 mozconfig（PGO 由 ZEN_GA_DISABLE_PGO 关掉）
        if: ${{ inputs.through == 'build' }}
        run: cat configs/windows/mozconfig

      - name: Build
        if: ${{ inputs.through == 'build' }}
        run: |
          set -x
          dos2unix configs/windows/mozconfig
          export ZEN_GA_DISABLE_PGO=1
          export ZEN_RELEASE=1
          bash ./scripts/mar_sign.sh -i || echo "!! mar_sign.sh 失败，继续"
          ulimit -n 4096
          date +%s > /tmp/build-start
          npm run build
          date +%s > /tmp/build-end
          echo "构建耗时秒数: $(( $(cat /tmp/build-end) - $(cat /tmp/build-start) ))"

      - name: 磁盘 · 构建后
        if: always()
        run: |
          df -h / | tee /tmp/disk-06.txt
          echo "=== 全阶段磁盘证据 ==="
          cat /tmp/disk-*.txt || true

      - name: 确认构建产物位置（obj-*/dist/bin）
        if: ${{ inputs.through == 'build' }}
        run: |
          # 上一轮的教训：可执行文件不在仓库根目录，而在 engine/obj-<target>/dist/bin/，
          # 深度 5。之前用 -maxdepth 3 扫，扫了个空，差点误判成"没编出东西"。
          echo "=== obj-*/dist/bin（真正的产物在这里）==="
          ls -la engine/obj-*/dist/bin/ 2>/dev/null | head -60 || echo "(无 dist/bin)"
          echo "=== exe 清单（不限深度）==="
          find engine/obj-* -name "*.exe" 2>/dev/null | head -30

      - name: Package（打包成可下载产物）
        if: ${{ inputs.through == 'build' }}
        run: |
          set -x
          export ZEN_GA_DISABLE_PGO=1
          export ZEN_RELEASE=1
          date +%s > /tmp/pkg-start
          npm run package || echo "!! package 失败 —— 下面仍会列出 dist 以便判断"
          date +%s > /tmp/pkg-end
          echo "打包耗时秒数: $(( $(cat /tmp/pkg-end) - $(cat /tmp/pkg-start) ))"
          echo "=== dist 内容 ==="; ls -la dist 2>/dev/null || echo "(无 dist)"

      - name: ★ 产物贴牌检查（读产物，不是读源码树）
        if: always()
        run: bash scripts/check-artifact-branding.sh engine/obj-x86_64-pc-windows-msvc/dist/bin

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokoa-win64-build
          path: |
            dist/*
            engine/obj-*/dist/bin/*.exe
          if-no-files-found: warn
          retention-days: 7

      - name: 产物清点
        if: always()
        run: |
          echo "=== 顶层 ==="; ls -la
          echo "=== engine/obj-* ==="; du -sh engine/obj-* 2>/dev/null || echo "(无 obj 目录)"
          echo "=== dist ==="; ls -la dist 2>/dev/null || echo "(无 dist)"
          echo "=== obj-*/dist/bin（前 40 项）==="; ls -la engine/obj-*/dist/bin/ 2>/dev/null | head -40 || echo "(无)"
          echo "=== 全部 exe（不限深度）==="
          find . -name "*.exe" -not -path "*/node_modules/*" -not -path "*/win-cross/*" 2>/dev/null | head -30 || true
