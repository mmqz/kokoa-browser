# Kokoa —— 首次运行 / 默认浏览器 / 任务栏的行为。
#
# 【为什么有这份文件】（2026-09-16 实机验收后加）
#   用户要求: 「将 Kokoa 设为默认浏览器并固定到任务栏，方便随手开启。
#             固定任务栏的提示，这个保持默认关闭不要弹出」
#
#   所以:
#     · 关掉「设为默认浏览器」的弹窗与主动引导
#     · 关掉固定到任务栏的提示
#     · 保留用户【自己手动】设默认的能力（不阻断，只是不打扰）

# 首次运行时不再弹「设为默认浏览器」
- name: browser.shell.checkDefaultBrowser
  value: false

# 不做「设为默认」的主动引导（那个会改系统设置）
- name: browser.shell.setDefaultBrowserUserChoice
  value: false

# 关掉「设为默认」的提示条 / 通知
- name: browser.shell.setDefaultGuidanceNotifications
  value: false

# 首次运行跳过默认浏览器检查（双保险）
- name: browser.shell.skipDefaultBrowserCheckOnFirstRun
  value: true

# 「固定到任务栏」的提示不弹
- name: browser.shell.pinToTaskbar
  value: false
